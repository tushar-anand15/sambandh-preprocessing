[project]
name = "sambandh-preprocessing"
version = "0.1.0"
description = "RAG retrieval pipeline for Sulekha municipal project documents"
readme = "docs/SPEC.md"
requires-python = ">=3.11"
dependencies = [
    # PDF Parsing with Docling (CPU-only)
    "docling>=2.79.0",
    # Database
    "psycopg[binary,pool]>=3.1",
    # Cloud Storage
    "google-cloud-storage>=2.14",
    # Config & CLI
    "python-dotenv>=1.0",
    "rich>=13.0",
    # Distributed OCR pipeline
    "celery[redis]>=5.3",
    "psutil>=5.9",
    "redis>=5.0",
    # Dashboard
    "streamlit>=1.30",
    "streamlit-pdf-viewer>=0.0.27",
    "pandas>=2.0",
    # Chunking
    "tiktoken>=0.5",
    # Embedding pipeline
    "pgvector>=0.3",
    "FlagEmbedding>=1.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sambandh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
