[project]
name = "sambandh-preprocessing"
version = "0.1.0"
description = "RAG retrieval pipeline for Sulekha municipal project documents"
readme = "docs/SPEC.md"
requires-python = ">=3.11"
dependencies = [
    # PDF Parsing
    "marker-pdf>=1.10.2",
    # Embeddings
    "FlagEmbedding>=1.2",
    "tiktoken>=0.7",
    # Database
    "psycopg[binary]>=3.0",
    "sqlalchemy>=2.0",
    # Cloud Storage
    "google-cloud-storage>=2.14",
    # Config & CLI
    "python-dotenv>=1.0",
    "rich>=13.0",
    "click>=8.1",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2",
    "pdftext>=0.6.3",
    "easyocr>=1.7.2",
    "surya-ocr>=0.6",
    "pdf2image>=1.17",
    "opencv-python-headless>=4.11.0.86",
    "docling>=2.79.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sambandh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
